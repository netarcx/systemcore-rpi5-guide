# Installed as /etc/systemd/system/limelight_visionserver{,1,2,3}.service.d/20-pi5b-camera.conf
#
# Each vision server only accepts a camera whose sysfs path includes the
# Limelight carrier board's internal USB hub (…/usb3/3-1/3-1.<n>/3-1.<n>:1.0).
# pi5b-camera-shim.so wraps realpath() so a camera plugged straight into a
# Pi 5B port is presented under that hub path. See the .c source for the
# port -> usb_id mapping; override it with PI5B_CAMERA_PORTS if needed.
[Service]
Environment=LD_PRELOAD=/usr/local/lib/pi5b-camera-shim.so
