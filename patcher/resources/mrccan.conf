# Fallback for /dev/mrccan.
#
# The real /dev/mrccan/{controldata,matchinfo,onbot_override} are misc devices
# registered by the robot_heartbeat kernel module, which ships in the image and
# loads fine on a Pi 5B — see /etc/modules-load.d/systemcore-pi5b.conf. This
# file only covers the case where that module is missing or fails to load: with
# the bare directory present, MrcCommDaemon creates plain files instead and
# still publishes the NT key /Netcomm/Control/ServerReady.
#
# Without either, MrcCommDaemon crash-loops on "Failed to open control data
# file", ServerReady is never set, and the WPILib HAL SIGABRTs the robot
# program ~10s after launch.
#
# systemd-tmpfiles runs early in boot, before mrccomm.service.
d /dev/mrccan 0755 root root -
