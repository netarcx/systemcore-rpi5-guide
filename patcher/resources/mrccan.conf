# Fallback for /dev/mrccan.
#
# The real /dev/mrccan/{controldata,matchinfo,onbot_override} are misc devices
# registered by the robot_heartbeat kernel module, which the
# limelight_canbusprocess override loads once can_s0..can_s4 all exist (its
# can_sender dependency needs at least one CAN netdev to load at all). This
# file only covers the case where that module is missing or fails to load:
# with the bare directory present, MrcCommDaemon creates plain files instead
# and still publishes the NT key /Netcomm/Control/ServerReady — enough for the
# robot program to start, but with no enable heartbeat on the CAN bus, so
# motors stay disabled. `ls -l /dev/mrccan` tells the two apart: character
# devices mean the module is loaded, regular files mean this fallback is in
# use.
#
# Without either, MrcCommDaemon crash-loops on "Failed to open control data
# file", ServerReady is never set, and the WPILib HAL SIGABRTs the robot
# program ~10s after launch.
#
# systemd-tmpfiles runs early in boot, before mrccomm.service.
d /dev/mrccan 0755 root root -
