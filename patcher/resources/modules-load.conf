# Kernel modules SystemCore expects to be loaded, installed as
# /etc/modules-load.d/systemcore-pi5b.conf.
#
# Upstream loads these at the tail of limelight_canbusprocess.service's
# ExecStart. This project replaces that ExecStart wholesale (to drive USB-CAN
# adapters instead of the carrier board's SPI controllers), so without this
# file they would never be loaded.
#
# robot_heartbeat is deliberately NOT listed here. modules-load.d runs at
# sysinit, long before any can_s* interface exists, and robot_heartbeat's
# dependency can_sender refuses to load with -ENODEV ("CAN Sender: No CAN
# devices found") when it finds no CAN netdevs — so loading it this early is a
# silent no-op and the robot never sends an enable heartbeat. The
# limelight_canbusprocess override modprobes it after the USB-CAN adapters are
# up and the vcan placeholders are in place, then restarts mrccomm.service.
i2c-dev
