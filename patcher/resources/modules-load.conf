# Kernel modules SystemCore expects to be loaded, installed as
# /etc/modules-load.d/systemcore-pi5b.conf.
#
# Upstream loads these at the tail of limelight_canbusprocess.service's
# ExecStart. This project replaces that ExecStart wholesale (to drive USB-CAN
# adapters instead of the carrier board's SPI controllers), so without this
# file they would never be loaded.
#
# robot_heartbeat registers the misc devices /dev/mrccan/{controldata,
# matchinfo,onbot_override} (+ read-only variants) that MrcCommDaemon opens
# before it publishes /Netcomm/Control/ServerReady — the NT key the WPILib HAL
# blocks on. It pulls in can_sender automatically. Loading it here rather than
# from the service means the device nodes exist before mrccomm.service starts,
# so MrcCommDaemon can't win the race and leave regular files sitting on the
# paths the module wants to populate.
robot_heartbeat
i2c-dev
