[Service]
# Wait for all five HAL-required buses, not just the first one: the WPILib HAL
# does SIOCGIFINDEX on can_s0..can_s4 and aborts if any is missing. Existence
# is the right test — the vcan placeholders canbusprocess creates report
# "state UNKNOWN" and never come UP, which is what upstream's ExecStartPre
# waits for. Start the robot anyway on timeout.
ExecStartPre=
ExecStartPre=/bin/bash -c 'echo "Waiting for can_s0..can_s4 (30s)..."; for i in $(seq 1 30); do ok=1; for n in 0 1 2 3 4; do [ -e "/sys/class/net/can_s$n" ] || ok=0; done; [ "$ok" = 1 ] && exit 0; sleep 1; done; echo "Not all of can_s0..can_s4 appeared, starting robot anyway"; exit 0'
