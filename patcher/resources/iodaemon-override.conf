# Installed as /etc/systemd/system/limelight_iodaemon.service.d/20-pi5b.conf
#
# iodaemon talks to the RP2350 "RT subsystem" and publishes what it reports:
# battery voltage, brownout, Smart I/O, RSL, IMU faults. On a Pi 5B none of
# the carrier-board sensing behind those exists, so the RP2350 firmware
# reports BROWNOUT permanently — and MrcCommDaemon reads /sys/brownout and,
# like a roboRIO in brownout protection, then never puts "enabled" into the
# CAN heartbeat. Every CTRE device stays "Robot Enable: Disabled" in Tuner X
# even though the robot program is enabled.
#
# So iodaemon does not start on a Pi 5B unless you opt back in with
#   sudo touch /etc/pi5b-enable-iodaemon
# (a failed condition leaves the unit inactive, not failed).
[Unit]
ConditionPathExists=/etc/pi5b-enable-iodaemon
