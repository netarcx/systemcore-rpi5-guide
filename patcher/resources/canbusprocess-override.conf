[Service]
# Bring-up order matters here:
#   1. rename + configure every USB-CAN adapter,
#   2. fill the unused can_s0..can_s4 slots with vcan placeholders,
#   3. only then load robot_heartbeat and restart mrccomm.service.
# can_sender (robot_heartbeat's dependency) enumerates can_s* netdevs in its
# module init and bails with -ENODEV ("CAN Sender: No CAN devices found") when
# there are none, and it snapshots the devices it finds — so loading it any
# earlier (modules-load.d, or the top of this ExecStart) silently no-ops on a
# Pi 5B and the robot never sends an enable heartbeat. Upstream's own unit
# modprobes it last for the same reason. Reloading needs MrcCommDaemon's file
# descriptors closed first, hence the stop/start around it.
#
# The same module holds a reference on every can_s* netdev it found, and a
# netdev with an outstanding reference cannot be deleted: `ip link delete` on
# a vcan placeholder (or the kernel's own teardown when a USB adapter is
# unplugged) blocks in "unregister_netdevice: waiting for can_sN to become
# free" until the reference goes away. So on every restart with the module
# already loaded, the FIRST thing this script does is stop every daemon that
# holds /dev/mrccan/* open (MrcCommDaemon, ExpansionHubDaemon and iodaemon
# hold enabledro), unload the module, and only then delete stale placeholders
# — and it skips the deletion if the unload didn't happen. The daemons that
# were running are started again once the module is back.
#
# `ip link set ... type can` applies its attributes in order and stops at the
# first one the driver rejects, leaving the earlier ones applied. gs_usb
# rejects restart-ms (EOPNOTSUPP), so appending it to the FD command left
# `fd on` set with no data bit-timing and the interface could never come up
# (verified on a CANable 2.5: "incorrect/missing data bit-timing"). Hence: no
# restart-ms here, and the classic-CAN fallback says `fd off` explicitly so a
# half-applied FD attempt can't poison it.
#
# Upstream (Beta 14+) ships this unit as Type=oneshot/RemainAfterExit=yes.
# Our ExecStart never returns (it watches for adapter hot-plug) and needs
# Restart=always, which systemd refuses on a oneshot service:
#   "Restart= set to either always or on-success ... isn't allowed for
#    Type=oneshot services. Refusing."
Type=simple
RemainAfterExit=no
ExecStart=
ExecStart=/bin/bash -c '\
  modprobe gs_usb 2>/dev/null; \
  modprobe i2c-dev 2>/dev/null; \
  HOLDERS=""; \
  if lsmod | grep -q "^robot_heartbeat "; then \
    for u in mrccomm expansionhubdaemon limelight_iodaemon; do systemctl is-active --quiet $u.service && HOLDERS="$HOLDERS $u.service"; done; \
    echo "Reloading robot_heartbeat: stopping$HOLDERS"; \
    systemctl stop $HOLDERS 2>/dev/null; \
    rmmod robot_heartbeat 2>/dev/null; \
    rmmod can_sender 2>/dev/null; \
  fi; \
  if lsmod | grep -q "^can_sender "; then \
    echo "can_sender still loaded (something holds /dev/mrccan open), keeping existing placeholders"; \
  else \
    for dev in /sys/class/net/can_s*/type; do \
      IFACE=$(basename $(dirname $dev)); \
      [ -e "/sys/class/net/$IFACE/device/driver" ] || ip link delete $IFACE 2>/dev/null; \
    done; \
  fi; \
  echo "Waiting for CAN adapters (30s timeout)..."; \
  for i in $(seq 1 30); do \
    for dev in /sys/class/net/*/type; do \
      [ "$(cat $dev 2>/dev/null)" = "280" ] && break 2; \
    done; \
    sleep 1; \
  done; \
  MAP=/etc/can_port_map; touch $MAP; \
  for dev in /sys/class/net/*/type; do \
    [ "$(cat $dev 2>/dev/null)" = "280" ] || continue; \
    IFACE=$(basename $(dirname $dev)); \
    [ -e "/sys/class/net/$IFACE/device/driver" ] || continue; \
    PORT=$(basename $(readlink -f /sys/class/net/$IFACE/device/.. 2>/dev/null)); \
    CAN_IDX=$(grep "^$PORT " $MAP 2>/dev/null | cut -d" " -f2); \
    if [ -z "$CAN_IDX" ]; then \
      MAX=$(cut -d" " -f2 $MAP 2>/dev/null | sort -n | tail -1); \
      [ -z "$MAX" ] && MAX=-1; \
      CAN_IDX=$((MAX + 1)); \
      echo "$PORT $CAN_IDX" >> $MAP; \
      echo "New port $PORT mapped to can_s$CAN_IDX"; \
    fi; \
    [ "$IFACE" = "can_s$CAN_IDX" ] && continue; \
    ip link set $IFACE down 2>/dev/null; \
    ip link set "can_s$CAN_IDX" down 2>/dev/null; \
    ip link set "can_s$CAN_IDX" name "_can_swap" 2>/dev/null; \
    ip link set $IFACE name "can_s$CAN_IDX" && echo "Renamed $IFACE -> can_s$CAN_IDX (USB port $PORT)"; \
    ip link set "_can_swap" name "$IFACE" 2>/dev/null; \
  done; \
  IFACES=$(ls -d /sys/class/net/can_s* 2>/dev/null | xargs -n1 basename); \
  if [ -n "$IFACES" ]; then \
    for iface in $IFACES; do \
      echo "Configuring $iface..."; \
      ip link set $iface down 2>/dev/null; \
      if ip link set $iface type can bitrate 1000000 dbitrate 5000000 fd on 2>/dev/null; then \
        echo "$iface: CAN FD (1Mbps/5Mbps)"; \
      else \
        ip link set $iface type can bitrate 1000000 fd off 2>/dev/null; \
        echo "$iface: standard CAN (1Mbps)"; \
      fi; \
      ip link set $iface txqueuelen 1000; \
      ip link set $iface up; \
    done; \
    sleep 1; \
    for iface in $IFACES; do \
      cansend $iface 000#00 && echo "CAN discovery frame sent on $iface" || echo "cansend failed on $iface"; \
    done; \
  else \
    echo "No USB CAN adapters found after 30s"; \
  fi; \
  modprobe vcan 2>/dev/null; \
  for n in 0 1 2 3 4; do \
    [ -e "/sys/class/net/can_s$n" ] && continue; \
    ip link add dev can_s$n type vcan 2>/dev/null && ip link set can_s$n up 2>/dev/null && echo "Added vcan placeholder can_s$n (no physical adapter)"; \
  done; \
  systemctl stop mrccomm.service 2>/dev/null; \
  for f in /dev/mrccan/*; do [ -f "$f" ] && rm -f "$f"; done; \
  if lsmod | grep -q "^robot_heartbeat "; then \
    echo "robot_heartbeat still loaded from an earlier run (could not unload it), heartbeat bus list may be stale"; \
  elif modprobe robot_heartbeat; then \
    echo "robot_heartbeat loaded (heartbeat on $(ls -d /sys/class/net/can_s* | wc -l) buses)"; \
  else \
    echo "robot_heartbeat failed to load, MrcCommDaemon will fall back to plain files"; \
  fi; \
  systemctl start mrccomm.service $HOLDERS 2>/dev/null; \
  COUNT=$(ls -d /sys/class/net/can_s* 2>/dev/null | wc -l); \
  echo "$COUNT total can_s* interfaces present (USB + vcan placeholders), monitoring..."; \
  while [ "$(ls -d /sys/class/net/can_s* 2>/dev/null | wc -l)" -ge "$COUNT" ]; do sleep 2; done; \
  echo "CAN adapter change detected, restarting..."'
Restart=always
RestartSec=3
